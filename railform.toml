# This repository's frame for railform: `railform frame` prints the effective frame and
# `railform frame --check` judges this file.

[project]
type = "python-package"

[python]
versions = ["3.11", "3.14"]

[ci]
self_hosted = true

[[exceptions]]
key = "ci.self_hosted"
value = true
reason = "railform calls its own reusable workflow by local path"

# The release version is written in two places: the package metadata and the newest heading of the
# changelog, which arrives with its section and is written by hand.
[[version.sites]]
path = "pyproject.toml"
pattern = "(?m)^version = '([0-9][^']*)'"

[[version.sites]]
path = "CHANGELOG.md"
pattern = '(?m)^## \[([0-9]+\.[0-9]+\.[0-9]+)\]'
authored = true
