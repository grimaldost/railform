railform:
  uses: __USES__
  permissions:
    contents: read
  with:
    railform-sha: __RAILFORM_SHA__
gate:
  if: always()
  needs: __NEEDS__
  runs-on: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && fromJSON(vars.LINUX_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
  permissions: {}
  steps:
    - name: Fail when a needed job failed or was cancelled
      if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      shell: bash
      run: exit 1
