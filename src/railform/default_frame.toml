# The default frame of railform (the development-rails spec, §2).
#
# The effective frame of a repository is this file's base tables, then the table under
# `presets.<project.type>`, then the repository's `railform.toml`. Arrays replace; tables merge
# key by key. The two guard lists, `session_loaded` and `private_refs.placeholders`, are the
# exception: a repository's list is joined to this one (these first, each element once).
# `presets` itself never reaches the effective frame.
#
# A key whose value has no meaning for a project type is present with the empty value of its
# type ("", [] or {}); the presets fill in the keys that differ by type.

# Globs of the paths a Claude Code session loads (the D1 guard of `railform session-paths`).
# A repository lists only the globs it adds; these stay whatever its list says, unless an
# `exceptions` row drops one with a reason.
session_loaded = [
    "**/skills/**",
    "**/agents/**",
    "**/commands/**",
    "**/output-styles/**",
    "**/hooks/**",
    "**/.claude-plugin/**",
    ".claude/**",
    "**/CLAUDE.md",
    "**/AGENTS.md",
    ".mcp.json",
]

# Departures from the preset that a repository declares: rows of a key and a reason, with an
# optional value that must then equal the departed value. A departure that loosens a check needs
# one (frame.py, LOOSENING); a row for a guard list names the default elements it leaves out in
# `drop` instead of a value.
exceptions = []

[meta]
# Keys whose value is inherently per repository: a value set for them is never a departure.
parameter_keys = [
    "project.type",
    "project.layout",
    "python.versions",
    "python.package",
    "version.sites",
    "changelog.records",
    "changelog.contract_surfaces",
    "release.since",
    "release.tag_prefix",
]

[project]
type = "python-package"
layout = ""

[commit]
types = [
    "feat",
    "fix",
    "docs",
    "chore",
    "refactor",
    "test",
    "ci",
    "build",
    "perf",
    "style",
    "revert",
    "release",
]
# Python `re` patterns, matched case-insensitively against each line of a message.
# keel's no-ai-attribution set at c3313fd (https://github.com/grimaldost/keel,
# .pre-commit-config.yaml), its one grep alternation split into its two branches; the stamp
# branch also names GPT and Anthropic anywhere later on the line (development-rails spec, §13,
# the craft-collection pilot). Both branches name the same products, each as a whole word:
# Claude (but not the file CLAUDE.md), GPT and ChatGPT, Anthropic, and Copilot (GitHub Copilot
# included). A name inside a longer word, such as an address at gptools.example, is no
# attribution.
attribution_patterns = [
    '^(Co-Authored-By|Signed-off-by|Assisted-by|Generated-by):.*\b(Claude\b(?!\.md\b)|(Chat)?GPT(?![A-Za-z])|Anthropic\b|Copilot\b)',
    '\bGenerated with\b.*\b(Claude\b(?!\.md\b)|(Chat)?GPT(?![A-Za-z])|Anthropic\b|Copilot\b)',
]

[changelog]
# Rows of a path prefix and the changelog file that records changes under it. A changed path
# belongs to the row with the longest matching prefix; "" matches every path. A repository's
# own list replaces this one whole, so one with only per-plugin changelogs has no root row.
records = [{ prefix = "", file = "CHANGELOG.md" }]
contract_surfaces = []
# Path prefixes that no record is charged for, whichever row would own them, unless a row names a
# prefix at least as long. The lock and the workflows are what a Dependabot pull request moves
# alone, and it cannot add a trailer; they ship nothing a changelog reader would look for.
unwatched = ["uv.lock", ".github/"]
trailer = "Changelog: none (<reason>)"
consumer_affecting = "advisory"
enabled = true

[hooks]
dir = ".githooks"
names = ["pre-commit", "commit-msg", "pre-push"]
# `{hooks.pre_commit_version}` in the wrapper is replaced by that key's value.
wrapper = ""
# The pinned pre-commit of a wrapper that runs it through uvx; set only by the type that does.
pre_commit_version = ""

[branch]
# A Python `re` pattern the whole branch name must match: a lowercase category, a slash and a
# lowercase slug. Measured (development-rails spec, §8) over the head branches of 454 merged pull
# requests: the commit types alone as categories accepted 93% of them, this shape all of them.
pattern = '^[a-z][a-z0-9-]*/[a-z0-9][a-z0-9._/-]*$'
# Globs of names that pass whatever the pattern says: the branches bots create. `**` spans `/`,
# `*` and `?` do not. Dependabot's are `dependabot/<ecosystem>/<dependency>`. A repository that
# takes changes from GitHub's web editor (`<user>-patch-<N>`) adds its own glob with an
# `exceptions` row; the measured count held none.
allow = ["dependabot/**"]

[private_refs]
names_file_env = "RAILFORM_PRIVATE_NAMES"
# False turns the names half of `railform private-refs` off for a private repository whose tracked
# files carry the listed names by design, on machines where the variable is set; it needs an
# `exceptions` row with a reason. The paths half stays on.
names_enabled = true
placeholders = [
  "me", "x", "someone", "alice", "user", "runner", "public", "default", "shared", "runneradmin",
]

[ci]
os = []
ruff_version = ""
# Workflow files under .github/workflows/ that may keep running on pull_request beside ci.yml.
extra_workflows = []
# True only in railform itself, whose ci.yml calls the reusable workflow by local path.
self_hosted = false

[ci.setup]
fetch_depth = 1
# Requirement specifiers installed into the job's environment after the sync (`uv pip install`).
extra_installs = []

[python]
versions = []
newest = "3.14"
package = ""
# Arguments added after the pipeline's `uv sync --frozen`; the Python version comes from
# `UV_PYTHON`, which the workflow sets for each matrix leg.
sync_args = []
test_command = ""
lint_paths = ["."]
type_check = ""

[version]
# Rows of a file path, a Python `re` pattern whose first group is the version there, and
# `authored` (default false): an authored site is checked and never rewritten.
sites = []

[release]
# Globs of the release metadata. The release check adds every changelog.records file and every
# version.sites path to them by itself.
metadata_paths = []
# The first release tag the release check judges (a tag name, compared by its version), so the
# tags from before adoption never fail it; "" judges every tag.
since = ""
# Rows of a path prefix (as in changelog.records) and the tag prefix of that record's releases;
# the longest matching prefix wins, and a repository's own list replaces this one whole. A row's
# optional `since` (default "") is its own floor, a tag name of that row, in place of
# release.since: per-plugin changelogs start tagging at their own versions.
tag_prefix = [{ prefix = "", tag = "v" }]
enabled = true
# The release pull request of a tag: one whose head branch starts with `pr_branch_prefix`, or
# whose title `pr_title_pattern` (a Python `re` pattern, matched at the start of the title)
# matches, and that carries the tag's version. An empty value identifies nothing by that side.
# The title default is the `release` type of the commit rules, any scope, with or without `!`.
pr_branch_prefix = "release/"
pr_title_pattern = '^release(\([^)]*\))?!?: '

# --- presets -----------------------------------------------------------------------------------

[presets.python-package.project]
layout = "src"

[presets.python-package.hooks]
wrapper = "uv run --frozen python -m pre_commit hook-impl"

# A package records what it ships: changes under src/. A change that moves only the lock or a
# workflow (a Dependabot pull request among them, which cannot add a trailer) is not charged.
[presets.python-package.changelog]
records = [{ prefix = "src/", file = "CHANGELOG.md" }]

[presets.python-package.ci]
os = ["ubuntu-latest", "windows-latest"]

[presets.python-package.python]
versions = ["3.11", "3.14"]
test_command = "uv run --frozen python -m pytest -q"
type_check = "src"

[presets.python-package.release]
metadata_paths = ["pyproject.toml", "uv.lock"]

[presets.python-scripts.project]
layout = "flat"

[presets.python-scripts.hooks]
wrapper = "uv run --frozen python -m pre_commit hook-impl"

[presets.python-scripts.ci]
os = ["ubuntu-latest", "windows-latest"]

[presets.python-scripts.python]
versions = ["3.11", "3.14"]
test_command = "uv run --frozen python -m pytest -q"

[presets.python-scripts.release]
metadata_paths = ["pyproject.toml", "uv.lock"]

# No uv project: ruff from uvx at ci.ruff_version, pre-commit from uvx at
# hooks.pre_commit_version, and pytest at the version railform locks, run outside any project.
[presets.plugin-marketplace.project]
layout = "plugins"

[presets.plugin-marketplace.hooks]
# An interpreter launch, as the uv types' wrapper is, never pre-commit's console-script shim:
# an application-control policy may refuse to launch a shim (development-rails spec, §13).
wrapper = "uvx --from pre-commit=={hooks.pre_commit_version} python -m pre_commit hook-impl"
pre_commit_version = "4.6.2"

[presets.plugin-marketplace.ci]
os = ["ubuntu-latest"]
ruff_version = "0.17.0"

[presets.plugin-marketplace.python]
versions = ["3.14"]
test_command = "uv run --no-project --with pytest==9.1.1 python -m pytest -q"

[presets.plugin-marketplace.release]
metadata_paths = [".claude-plugin/marketplace.json", "plugins/*/.claude-plugin/plugin.json"]
