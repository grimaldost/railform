# railform's own CI calls its reusable workflow by local path (`ci.self_hosted` in railform.toml),
# so every change runs through the workflow it ships, at the commit under test. The railform and
# gate jobs are written by `railform adopt`.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  # >>> railform: owned by `railform adopt`; `railform adopt --check` fails on any edit
  railform:
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      railform-sha: ${{ github.event.pull_request.head.sha || github.sha }}
  gate:
    if: always()
    needs: [railform, extra]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        shell: bash
        run: exit 1
  # <<< railform
  extra:
    runs-on: ubuntu-latest
    steps:
      - name: Fail on purpose, as a red proof of gate
        run: exit 1
