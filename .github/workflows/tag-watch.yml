# The reusable tag watch of railform (the development-rails spec, §16).
#
# A repository calls it from the `railform-tag-watch.yml` that `railform adopt` writes, on every
# tag push, every day and on demand, at a pinned commit of railform, and passes the same commit
# as the required input `railform-sha`. `railform release-check` judges every release tag from
# the frame's floor on, anew on every run, so a tag moved off its release merge commit fails the
# next day.
name: tag-watch
on:
  workflow_call:
    inputs:
      railform-sha:
        description: The railform commit, 40 hexadecimal characters, whose commands the job runs.
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
env:
  RAILFORM_SHA: ${{ inputs.railform-sha }}
  # The date the `uvx` step resolves its dependencies as of (uv's `UV_EXCLUDE_NEWER`, mapped into
  # that step). Each railform release moves it to its own day, in a commit of the release pull
  # request that is not the `release:` commit. `python-ci.yml` holds the same value.
  RAILFORM_EXCLUDE_NEWER: '2026-10-25T00:00:00Z'
defaults:
  run:
    shell: bash
jobs:
  release-check:
    runs-on: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && fromJSON(vars.LINUX_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Check that railform-sha is a full commit
        run: |
          if [[ ! "$RAILFORM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::railform-sha must be a railform commit of 40 hexadecimal characters"
            exit 1
          fi
      # The whole history brings the tags. On a push, and on a dispatch from a tag, the default
      # branch is checked out rather than the ref, so the checkout's handling of a tag ref cannot
      # lay a lightweight tag over an annotated one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ (github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')) && github.event.repository.default_branch || '' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.19'
          enable-cache: false
      - name: railform release-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform release-check
