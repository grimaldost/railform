# The reusable CI workflow of railform (the development-rails spec, §9).
#
# A repository calls it from its ci.yml through the `railform` job that `railform adopt` writes,
# at a pinned commit of railform, and passes the same commit as the required input
# `railform-sha`. Every railform command here runs from that commit, installed with
# `uvx --from git+https://github.com/grimaldost/railform@<40-hex sha>`.
#
# The type's pipeline is not written here: `frame` reads it from the caller's effective frame
# (`railform frame --github-output`), and `checks` runs it, one command per line, in that order.
# The caller's `gate` job, written by `railform adopt`, is the one required status.
name: python-ci
on:
  workflow_call:
    inputs:
      railform-sha:
        description: The railform commit, 40 hexadecimal characters, whose commands the jobs run.
        required: true
        type: string
permissions:
  contents: read
env:
  RAILFORM_SHA: ${{ inputs.railform-sha }}
  # The date every `uvx` step resolves its dependencies as of (uv's `UV_EXCLUDE_NEWER`, mapped
  # into each step that needs it; the `checks` job's pipeline step never sees it). Each railform
  # release moves it to its own day, in a commit of the release pull request that is not the
  # `release:` commit. `tag-watch.yml` holds the same value.
  RAILFORM_EXCLUDE_NEWER: '2026-10-25T00:00:00Z'
defaults:
  run:
    shell: bash
jobs:
  frame:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ci_os: ${{ steps.frame.outputs.ci_os }}
      ci_setup: ${{ steps.frame.outputs.ci_setup }}
      python_versions: ${{ steps.frame.outputs.python_versions }}
      pipeline: ${{ steps.frame.outputs.pipeline }}
      hooks_python: ${{ steps.frame.outputs.hooks_python }}
    steps:
      - name: Check that railform-sha is a full commit
        run: |
          if [[ ! "$RAILFORM_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::railform-sha must be a railform commit of 40 hexadecimal characters"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          enable-cache: false
      - name: railform frame --check
        env:
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform frame --check
      - name: railform frame --github-output
        id: frame
        env:
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform frame --github-output

  checks:
    needs: frame
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.frame.outputs.ci_os) }}
        python: ${{ fromJSON(needs.frame.outputs.python_versions) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ fromJSON(needs.frame.outputs.ci_setup).fetch_depth }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
      - name: railform private-refs
        env:
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform private-refs
      - name: railform version-sites
        env:
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform version-sites
      - name: The type's pipeline, from the frame
        env:
          PIPELINE: ${{ needs.frame.outputs.pipeline }}
        run: |
          set -eo pipefail
          # One command per line, in the frame's order; the first that fails stops the job.
          while IFS= read -r -u 3 step; do
            if [ -z "$step" ]; then continue; fi
            echo "::group::$step"
            eval "$step" < /dev/null
            echo "::endgroup::"
          done 3<<< "$PIPELINE"

  commit-lane:
    needs: frame
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          enable-cache: false
      - name: railform commit-range
        env:
          BASE_REF: ${{ github.base_ref }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform commit-range "origin/${BASE_REF}...HEAD"
      - name: railform pr-text
        env:
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform pr-text
      # The head branch's name is chosen by whoever pushed it: it reaches the command through
      # the environment, never through the script text.
      - name: railform branch-name
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform branch-name -- "$HEAD_REF"
      # The checks job scans the tracked files; this step scans what only a pull request carries:
      # the range's commit messages and the title and body in the event payload.
      - name: railform private-refs (the range, its messages and the pull request)
        env:
          BASE_REF: ${{ github.base_ref }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform private-refs --diff "origin/${BASE_REF}...HEAD" --event "$GITHUB_EVENT_PATH"

  # The changelog gate (the development-rails spec, §14) judges every commit the pull request
  # adds, so the checkout takes the whole history. On a push it is skipped, which counts as
  # passing.
  changelog:
    needs: frame
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          enable-cache: false
      - name: railform changelog-gate
        env:
          BASE_REF: ${{ github.base_ref }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform changelog-gate "origin/${BASE_REF}...HEAD"
      # The checks job reads version.sites from the frame the pull request writes; here, with
      # the history, they come from the frame of the merge base, which the pull request cannot
      # edit.
      - name: railform version-sites --base (the frame of the merge base)
        env:
          BASE_REF: ${{ github.base_ref }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform version-sites --base "origin/${BASE_REF}"

  hooks:
    needs: frame
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          enable-cache: false
      - name: railform hooks-check
        env:
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform hooks-check
      - name: railform adopt --check
        env:
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx --from "git+https://github.com/grimaldost/railform@$RAILFORM_SHA" railform adopt --check
      # The hygiene entry `railform adopt` writes, run over the files the pull request changes,
      # never over every file. Every hook runs, so one run reports every hook that fails.
      # pre-commit runs on the newest Python of the frame, so a `default_language_version` that
      # names the repository's Python finds its interpreter.
      - name: Replay the hygiene hooks over the changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HOOKS_PYTHON: ${{ needs.frame.outputs.hooks_python }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: |
          set -eo pipefail
          status=0
          for hook in trailing-whitespace end-of-file-fixer check-merge-conflict \
              check-added-large-files check-yaml check-toml check-json; do
            uvx --python "$HOOKS_PYTHON" pre-commit==4.6.2 run "$hook" --show-diff-on-failure \
              --from-ref "origin/${BASE_REF}" --to-ref HEAD || status=1
          done
          exit "$status"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.19'
          enable-cache: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          UV_EXCLUDE_NEWER: ${{ env.RAILFORM_EXCLUDE_NEWER }}
        run: uvx zizmor==1.30.0 --min-severity high .github/workflows
