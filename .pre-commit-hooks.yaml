# The pre-commit hooks of railform (development-rails spec, §8). Each runs the railform command
# installed from the same commit as this file, so a repository that pins one commit of railform
# gets the hooks and the checks of that commit. The hygiene hooks are pre-commit/pre-commit-hooks,
# which `railform adopt` references next to these; they are not declared again here.
- id: railform-commit-msg
  name: railform commit-msg
  description: Conventional Commits subject with the frame's types, and no AI attribution.
  entry: railform commit-msg
  language: python
  stages: [commit-msg]
  minimum_pre_commit_version: 3.2.0
- id: railform-branch-name
  name: railform branch-name
  description: >-
    The pushed branch name, as the remote will see it, matches branch.allow or branch.pattern.
  entry: railform branch-name
  language: python
  stages: [pre-push]
  # Run even when the pushed commits change no file, and pass no file names: the verb reads
  # the remote branch from PRE_COMMIT_REMOTE_BRANCH.
  always_run: true
  pass_filenames: false
  minimum_pre_commit_version: 3.2.0
- id: railform-hooks-check
  name: railform hooks-check
  description: The hook wrappers in hooks.dir exist, are tracked as 100755 and are unedited.
  entry: railform hooks-check
  language: python
  stages: [pre-commit]
  # Run on every commit: pre-commit leaves deleted paths out of the staged files, so a commit
  # that only deletes a wrapper, or only changes railform.toml, would skip the check otherwise.
  always_run: true
  # The default hooks.dir, beside the repository's own that `railform adopt` writes in its
  # `files:`. With `always_run` it no longer decides whether the hook runs.
  files: ^\.githooks/
  pass_filenames: false
  minimum_pre_commit_version: 3.2.0
- id: railform-private-refs
  name: railform private-refs
  description: No home-directory path in the staged files.
  entry: railform private-refs
  language: python
  stages: [pre-commit]
  minimum_pre_commit_version: 3.2.0
