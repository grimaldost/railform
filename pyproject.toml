[project]
name = 'railform'
version = '0.2.0'
description = 'Shared CI workflow, commit hooks and repository checks, referenced at a pinned commit.'
readme = 'README.md'
requires-python = '>=3.11'
license = 'MIT'
authors = [
    { name = 'Grimaldo Stanzani Junior' },
]
classifiers = [
    'Private :: Do Not Upload',
]
dependencies = [
    'pyyaml>=6',
]

[project.scripts]
railform = 'railform.cli:main'

[build-system]
requires = ['uv_build>=0.12.19,<0.13']
build-backend = 'uv_build'

[dependency-groups]
lint = ['ruff>=0.16.9', 'ty']
test = ['pytest>=8.0']
dev = [
    { include-group = 'lint' },
    { include-group = 'test' },
    'pre-commit>=4.6.2',
]

[tool.ruff]
line-length = 100
target-version = 'py311'
src = ['src', 'tests']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'B', 'I', 'N', 'UP', 'S', 'TC', 'RUF']
ignore = ['S603', 'S607']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101', 'TC003']

[tool.ruff.lint.isort]
known-first-party = ['railform']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '--strict-markers --strict-config -ra'
markers = [
    'slow: needs the network (uv resolution, pre-commit hook environments); runs by default',
]
