# Copied from github.com/grimaldost/fathom at commit 9d357a5204804de7d01da14b63e6ff0f3c4c4ab7, blob f497305fc2c2b775a7d3f32d6a8ad61231e18818 of railform.toml
# The adopter's file begins on line 4, byte for byte, its own leading comments included;
# tests/test_adopter_frames.py keeps it readable by every verb that reads a frame.
# This repository's frame for railform: `railform frame` prints the effective frame and
# `railform frame --check` judges this file.
[project]
type = "python-package"

[python]
versions = ["3.12"]
type_check = ""

[changelog]
# What reaches an installed copy, plus the tooling the gates and hooks run from: the package
# (src/, package data included), its metadata, the plugin surface and the repository's own
# tooling. Docs, examples, tests, CI configuration and uv.lock are not charged.
records = [
  { prefix = "src/", file = "CHANGELOG.md" },
  { prefix = "pyproject.toml", file = "CHANGELOG.md" },
  { prefix = ".claude-plugin/", file = "CHANGELOG.md" },
  { prefix = "commands/", file = "CHANGELOG.md" },
  { prefix = "mcp/", file = "CHANGELOG.md" },
  { prefix = "skills/", file = "CHANGELOG.md" },
  { prefix = "tools/", file = "CHANGELOG.md" },
  { prefix = ".githooks/", file = "CHANGELOG.md" },
]

[private_refs]
# User names that appear in home-directory paths in this repository's tests and docstrings and
# name nobody: "example" and "examples", the neutral names its path tests use
# (tests/test_public_tree.py), "u", a one-letter test value (tests/test_agent_acceptance.py), and
# "longna~1", the 8.3 short name in a docstring (src/fathom/strategies/gated_session.py).
placeholders = ["example", "examples", "u", "longna~1"]

[release]
# v0.8.0 was never released through a pull request, so the release check starts at v0.9.0.
since = "v0.9.0"
# The files a fathom release commit edits besides the changelog (CONTRIBUTING.md, "Releasing"):
# the version sites, the pinned install lines, the backlog's "Unreleased" markers and the lock.
metadata_paths = [
  "pyproject.toml",
  "uv.lock",
  ".claude-plugin/plugin.json",
  "README.md",
  "README-plugin.md",
  "docs/backlog.md",
  "skills/fathom-eval/reference/authoring.md",
]

[[exceptions]]
key = "python.type_check"
value = ""
reason = "fathom has no type-check gate and no type checker among its development tools; adding one is outside this adoption"

[[exceptions]]
key = "release.metadata_paths"
value = ["pyproject.toml", "uv.lock", ".claude-plugin/plugin.json", "README.md", "README-plugin.md", "docs/backlog.md", "skills/fathom-eval/reference/authoring.md"]
reason = "a fathom release commit also sets the plugin manifest version, the pinned install lines in both READMEs and the authoring guide, and the Unreleased markers in docs/backlog.md"

[[exceptions]]
key = "private_refs.placeholders"
value = ["example", "examples", "u", "longna~1"]
reason = "four user names that appear in home-directory paths in this repository's tests and docstrings and name nobody: 'example' and 'examples', the neutral names its path tests use, 'u', a one-letter test value, and 'longna~1', the 8.3 short name in a docstring; they are not real accounts, and the private-reference scan would otherwise flag each path"
